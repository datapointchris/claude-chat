name: chat

services:
  chat:
    image: ghcr.io/datapointchris/claude-chat:${CHAT_IMAGE_TAG:?set CHAT_IMAGE_TAG to a sha-<short> tag}
    container_name: chat
    restart: unless-stopped
    ports:
      - '80:3001'
    env_file: .env
    security_opt:
      - no-new-privileges:true
    volumes:
      # WORKSPACES_ROOT. The agent writes here. Refuses to start when absent:
      # an invented root-owned directory would pass the app's realpath check and
      # present as an empty corpus rather than as an error.
      - type: bind
        source: /srv/corpus
        target: /srv/corpus
        bind:
          create_host_path: false
      # HOME. Holds auth.db, ~/.claude/projects transcripts and ~/.cloudcli
      # assets. Outside the clone: /srv/chat is a git checkout the deploy pulls
      # in, and git clean -fdx there is a thing someone does to unstick a pull.
      # -x reaches it precisely because .gitignore covers data/.
      - type: bind
        source: /var/db/chat
        target: /data
        bind:
          create_host_path: false
      # Read-only binds. A bind mounted read-only cannot be written whatever the
      # file's ownership, which is what stops the agent's own Bash tool editing
      # its guidance or its permissions.
      #
      # create_host_path is off on both. Compose otherwise invents a missing
      # source as a directory, so a deploy that has not placed these yet would
      # mount a directory where the deny list belongs and start with no deny
      # list at all, reporting healthy throughout.
      - type: bind
        source: ./claude/CLAUDE.md
        target: /data/.claude/CLAUDE.md
        read_only: true
        bind:
          create_host_path: false
      # The rest of the behaviour profile. Absolute, because it is outside this
      # clone — /srv/chat is a git checkout the deploy pulls in, and the profile
      # is rsynced separately from the operator's own ~/.claude.
      #
      # Mounted piece by piece rather than as one bind over /data/.claude,
      # because that directory is live: the CLI writes settings.json, projects/
      # and sessions/ there, and a bind over it would hide all three.
      #
      # These are directory binds, so a skill added at a desk appears here on
      # the next deploy without a restart. CLAUDE.md above is a single file, and
      # replacing it swaps the inode, so that one needs the container recreated.
      - type: bind
        source: /srv/claude-profile/output-styles
        target: /data/.claude/output-styles
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/claude-profile/skills
        target: /data/.claude/skills
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/claude-profile/agents
        target: /data/.claude/agents
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/claude-profile/commands
        target: /data/.claude/commands
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./claude/managed-settings.json
        target: /etc/claude-code/managed-settings.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
