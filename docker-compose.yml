name: chat

services:
  chat:
    image: ghcr.io/datapointchris/claude-chat:latest
    container_name: chat
    restart: unless-stopped
    pull_policy: always
    ports:
      - '80:3001'
    env_file: .env
    # No `no-new-privileges`: it blocks the setuid bit the agent's sudo needs.
    volumes:
      # WORKSPACES_ROOT. The agent writes here.
      - type: bind
        source: /srv/corpus
        target: /srv/corpus
        bind:
          create_host_path: false
      # HOME. Holds auth.db, ~/.claude/projects transcripts and ~/.cloudcli
      # assets. Outside the clone, so `git clean -fdx` there cannot reach it.
      - type: bind
        source: /var/db/chat
        target: /data
        bind:
          create_host_path: false
      # CLAUDE.md is deliberately not bound. It lives inside the data mount so
      # the agent can edit its own instructions and the edit persists.
      #
      # The behaviour profile, rsynced from the operator's ~/.claude.
      # Mounted piece by piece because /data/.claude is live — the CLI writes
      # settings.json, projects/ and sessions/ there.
      - type: bind
        source: /srv/claude-profile/output-styles
        target: /data/.claude/output-styles
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/claude-profile/skills
        target: /data/.claude/skills
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/claude-profile/agents
        target: /data/.claude/agents
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/claude-profile/commands
        target: /data/.claude/commands
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./claude/managed-settings.json
        target: /etc/claude-code/managed-settings.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
