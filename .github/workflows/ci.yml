name: Bespoke CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  LOCAL_TAG: claude-chat:verify

jobs:
  image:
    name: Build, verify & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.LOCAL_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it
        # No -u and no -e: every assertion below reads what the image declares.
        run: |
          mkdir -p /tmp/verify/data /tmp/verify/corpus
          chmod -R 777 /tmp/verify
          docker run -d --name verify \
            -e WORKSPACES_ROOT=/srv/corpus \
            -e DATABASE_PATH=/data/auth.db \
            -e JWT_SECRET=ci-verification-only \
            -v /tmp/verify/data:/data:rw \
            -v /tmp/verify/corpus:/srv/corpus:rw \
            -p 3001:3001 \
            "$LOCAL_TAG"
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3001/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "server never answered /health"
          docker logs verify
          exit 1

      - name: /health answers
        run: curl -fsS http://localhost:3001/health | tee /dev/stderr | jq -e '.status == "ok"'

      - name: The image runs as uid 1000
        run: |
          uid=$(docker exec verify id -u)
          echo "uid=$uid"
          [ "$uid" = "1000" ]

      - name: The agent's toolchain is present
        run: |
          rc=0
          for t in python3 pip3 uv uvx node npm claude git rg fd eza jq yq tokei \
                   sqlite3 curl wget less tree make gcc sudo ps; do
            if docker exec verify sh -c "command -v $t" >/dev/null 2>&1; then
              echo "present: $t"
            else
              echo "MISSING: $t"
              rc=1
            fi
          done
          exit $rc

      - name: The agent can escalate to install a package
        run: docker exec verify sudo -n true

      - name: pip can write to the interpreter
        run: docker exec verify sudo -n python3 -m pip install --quiet --no-input tomli-w

      - name: The image carries VITE_IS_PLATFORM
        # Both halves are compiled in, so the image has to declare the server's.
        run: |
          value=$(docker exec verify printenv VITE_IS_PLATFORM)
          echo "VITE_IS_PLATFORM=$value"
          [ "$value" = "true" ]

      - name: Platform mode is live, server side
        # authenticateToken emits this only when IS_PLATFORM is true and the
        # users table is empty.
        run: |
          body=$(curl -s http://localhost:3001/api/projects)
          echo "$body"
          echo "$body" | jq -e '.error == "Platform mode: No user found in database"'

      - name: No login form in any client chunk
        # Reads every asset the image ships, because vite splits the build four
        # ways. agents.login.title is the positive control that proves these
        # bytes are the client bundle.
        run: |
          docker exec verify sh -c 'cat /app/dist/assets/*.js' > /tmp/bundle.js
          echo "bytes read: $(wc -c < /tmp/bundle.js)"

          if ! grep -qF -- '"agents.login.title"' /tmp/bundle.js; then
            echo "FAIL: control string absent — this is not the client bundle"
            exit 1
          fi
          echo "control present: \"agents.login.title\""

          rc=0
          for marker in '"login.errors.requiredFields"' '"login.placeholders.username"' '"confirmPassword"'; do
            if grep -qF -- "$marker" /tmp/bundle.js; then
              echo "FAIL: bundle carries $marker — built without VITE_IS_PLATFORM"
              rc=1
            else
              echo "absent: $marker"
            fi
          done
          exit $rc

      - name: Stop it
        if: always()
        run: docker rm -f verify || true

      - uses: docker/login-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image that was verified
        # Tags the local image the steps above ran against. A second
        # build-push-action would rebuild and could publish untested bytes.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tag="$REGISTRY/$IMAGE_NAME:latest"
          docker tag "$LOCAL_TAG" "$tag"
          docker push "$tag"
